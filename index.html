    <script type="importmap">

            "imports": {
                "react": "https://esm.sh/react@18.2.0",

    <!-- 引入 Babel 用於瀏覽器內編譯 JSX -->

    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .markdown-text ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-text li { margin-bottom: 0.5rem; }
        .markdown-text strong { color: #0f766e; } /* teal-700 */

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 20s linear infinite;
        }

        @keyframes float-x {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }
        .animate-float-x {
            animation: float-x 5s ease-in-out infinite;
        }

        /* 避免載入時閃爍 */
        #root:empty { opacity: 0; }
        #root { transition: opacity 0.5s ease-in; opacity: 1; }
    </style>
</head>

            setAnimate(true);

        // 切換日期時重置
        useEffect(() => {

        // 初始化手帳

            if (savedJournal) {

        const itineraryData = [

                    { time: "11:00", icon: <Sun className="w-5 h-5" />, title: "琉球窯體驗", desc: "彩繪風獅爺體驗 (約1.2hr)，製作獨一無二的紀念品" },
                    { time: "12:30", icon: <Utensils className="w-5 h-5" />, title: "午餐時間", desc: "休息充電" },
                    { time: "14:00", icon: <Waves className="w-5 h-5" />, title: "備瀨崎海灘", desc: "透明度極高的海水" },

            {

                location: "瀨底島 -> 美國村",
                coordinates: { lat: 26.3160, lon: 127.7570 }, // 美國村 (北谷)
                color: "bg-indigo-100 text-indigo-800",
                hotel: "LAPIN MIHAMA Residence Hotel (4+5)",
                events: [
                    { time: "08:00", icon: <Car className="w-5 h-5" />, title: "出發", desc: "前往中部" },
                    { time: "09:00", icon: <MapPin className="w-5 h-5" />, title: "CAVE OKINAWA", desc: "神奇的鐘乳石洞 (約0.5hr)" },
                    { time: "10:00", icon: <Coffee className="w-5 h-5" />, title: "早午餐時光", desc: "補充能量" },
                    { time: "11:30", icon: <Waves className="w-5 h-5" />, title: "黑潮浮潛", desc: "夢幻青之洞窟浮潛體驗 (約2.5hr)" },
                    { time: "14:00", icon: <Car className="w-5 h-5" />, title: "離開真榮田岬", desc: "" },
                    { time: "14:30", icon: <Camera className="w-5 h-5" />, title: "Beach 51 秘境海灘", desc: "絕美海景拍照點" },
                    { time: "15:30", icon: <BedDouble className="w-5 h-5" />, title: "美國村 Check-in", desc: "入住飯店" },
                    { time: "17:00", icon: <Sun className="w-5 h-5" />, title: "美國村夕陽", desc: "逛大街、看夕陽，感受異國風情" },
                ]
            },
            {
                date: "5/26",
                day: "二",
                title: "文化散策・那霸市區",
                location: "美國村 -> 那霸",
                coordinates: { lat: 26.2124, lon: 127.6809 }, // 那霸
                color: "bg-orange-100 text-orange-800",
                hotel: "Hewitt Resort Naha (4+5) 含早餐",
                events: [
                    { time: "08:00", icon: <Car className="w-5 h-5" />, title: "出發", desc: "返回南部" },
                    { time: "09:00", icon: <MapPin className="w-5 h-5" />, title: "浜比嘉島探險", desc: "感受神之島的寧靜" },
                    { time: "10:30", icon: <ShoppingBag className="w-5 h-5" />, title: "AEON Mall 採購", desc: "伴手禮補貨時間" },
                    { time: "11:50", icon: <Car className="w-5 h-5" />, title: "那霸還車", desc: "結束自駕行程" },
                    { time: "12:20", icon: <Utensils className="w-5 h-5" />, title: "牧志公設市場 / 國際通", desc: "午餐 & 逛街購物" },
                    { time: "14:00", icon: <Star className="w-5 h-5" />, title: "teamLab Future Park", desc: "沖繩展覽體驗" },
                    { time: "15:00", icon: <Coffee className="w-5 h-5" />, title: "壺屋陶藝街", desc: "走走逛逛陶藝店，感受文藝氣息" },
                    { time: "18:00", icon: <Utensils className="w-5 h-5" />, title: "晚餐推薦", desc: "屋台村或小吃街，享受熱鬧夜晚" },
                ]
            },
            {
                date: "5/27",
                day: "三",
                title: "旅程尾聲・返家",
                location: "那霸 -> 桃園",
                coordinates: { lat: 26.2124, lon: 127.6809 }, // 那霸
                color: "bg-gray-100 text-gray-800",
                hotel: null,
                events: [
                    {
                        time: "08:10",
                        icon: <Plane className="w-5 h-5" />,
                        title: "那霸機場 Check-in",
                        desc: "虎航 IT231 (10:10 起飛) | 那霸國際線航廈 | 帶著滿滿的回憶準備登機"
                    },
                    {
                        time: "10:40",
                        icon: <MapPin className="w-5 h-5" />,
                        title: "抵達桃園",
                        desc: "IT231 表定 10:40 抵達 | T1 第一航廈 | 溫暖的家"
                    },
                ]
            }

        const currentItinerary = itineraryData[activeDay];

        // Weather API (帶有錯誤處理與備案數據)
        const fetchWeather = async ({ lat, lon }) => {
            setWeatherLoading(true);
            setIsWeatherFallback(false);
            try {
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=Asia%2FTokyo`
                );
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                const data = await response.json();
                setWeatherData(data.current);
            } catch (error) {
                console.warn("天氣 API 連線失敗，切換至 5 月平均氣候備案。", error);
                // 備案：使用沖繩 5 月平均氣候數據
                setIsWeatherFallback(true);
                setWeatherData({
                    temperature_2m: 26,
                    weather_code: 1 // 1: 主要是晴天
                });
            } finally {
                setWeatherLoading(false);
            }
        };

        const getWeatherIcon = (code) => {
            if (code === undefined) return <Sun className="w-6 h-6 text-orange-400" />;
            if (code <= 3) return <CloudSun className="w-6 h-6 text-orange-400" />;
            if (code <= 48) return <Cloud className="w-6 h-6 text-gray-400" />;
            if (code <= 82) return <CloudRain className="w-6 h-6 text-blue-400" />;
            return <Sun className="w-6 h-6 text-orange-400" />;
        };

        // AI 助手 (需要填入 API Key)
        const askGemini = async (type) => {
            setAiLoading(true);
            setAiResponse(null);
            setAiError(null);

            setTimeout(() => {
                responseRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, 100);

            // *** 如果您想在本地檔案使用 AI 功能，請在此填入您的 Google Gemini API Key ***
            const apiKey = "";

            if (!apiKey) {
                setAiError("請在原始碼中填入 Gemini API Key 才能在本地使用 AI 功能。");
                setAiLoading(false);
                return;
            }

            const locations = currentItinerary.events.map(e => e.title).join(", ");

            let prompt = "";
            if (type === 'food') {
                prompt = `我正在沖繩旅行，今天的行程主要在：${currentItinerary.location}。行程包含：${locations}。
                    請以「在地老饕」的角度，推薦 3 個這附近的必吃美食或餐廳（請包含午餐、下午茶甜點或晚餐選項）。
                    請給我餐廳名稱、推薦菜色以及為什麼推薦它。請用繁體中文回答，語氣輕鬆愉快，像在給朋友建議。
                    不需要列出所有行程，專注於推薦美食。`;
            } else if (type === 'guide') {
                prompt = `我正在沖繩旅行，今天的行程是：${locations}。
                    請挑選其中 2-3 個最有趣的景點，告訴我關於它們的「冷知識」、「歷史故事」或是「必拍角度」。
                    我想知道一些旅遊書上不一定會寫的小趣事。
                    請用繁體中文回答，語氣生動有趣。`;
            } else if (type === 'translation') {
                prompt = `我正在沖繩旅行，今天的行程包含：${locations}。
                    請根據今天的行程場景（例如：租車、海邊活動、餐廳點餐、購物），提供 5 句我今天最可能用到的「實用日語短句」。
                    格式要求：
                    1. 中文意思
                    2. 日文原文
                    3. 羅馬拼音 (Pronunciation)
                    請用繁體中文回答。`;
            }

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                        }),
                    }
                );

                if (!response.ok) {
                    throw new Error(`API call failed: ${response.status}`);
                }

                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (text) {
                    setAiResponse(text);
                } else {
                    throw new Error("No response text found");
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                setAiError("AI 暫時無法回應，請稍後再試。（可能是網路問題或配額限制）");
            } finally {
                setAiLoading(false);
            }
        };

        const handleNavigation = () => {
            const destinations = currentItinerary.events
                .map(event => {
                    let title = event.title;
                    if (title.includes("桃園機場")) return "桃園國際機場";
                    if (title.includes("抵達沖繩")) return "那霸機場";
                    if ((title.includes("Check-in") || title.includes("飯店")) && currentItinerary.hotel) {
                        return currentItinerary.hotel.split('(')[0].trim();
                    }
                    const stopWords = ["租車", "還車", "出發", "離開", "休息", "晚餐推薦", "採購", "買"];
                    if (stopWords.some(word => title.includes(word))) {
                        if (title.includes("AEON")) return "AEON Mall Okinawa";
                        return null;
                    }
                    if (title.includes("午餐") || title.includes("晚餐")) return null;
                    return title;
                })
                .filter(Boolean);

            if (destinations.length === 0) {
                if (currentItinerary.coordinates) {
                    const { lat, lon } = currentItinerary.coordinates;
                    window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lon}`, '_blank');
                }
                return;
            }

            const queryPath = destinations.map(loc => {
                if (loc.includes("桃園") || loc.includes("機場") || loc.includes("AEON")) return encodeURIComponent(loc);
                return encodeURIComponent("沖繩 " + loc);
            }).join("/");

            window.open(`https://www.google.com/maps/dir/${queryPath}`, '_blank');
        };

        const handleOpenNote = (dayIndex, eventIndex, title) => {
            const key = `${dayIndex}-${eventIndex}`;
            setEditingNote({
                dayIndex,
                eventIndex,
                title,
                text: journalEntries[key] || ""
            });
        };

        const handleSaveNote = () => {
            if (!editingNote) return;
            const key = `${editingNote.dayIndex}-${editingNote.eventIndex}`;
            const newEntries = { ...journalEntries, [key]: editingNote.text };

            if (!editingNote.text.trim()) {
                delete newEntries[key];
            }

            setJournalEntries(newEntries);
            localStorage.setItem('okinawa_trip_journal', JSON.stringify(newEntries));
            setEditingNote(null);
        };

                {/* Background Decor */}
                <div className="fixed top-0 left-0 w-full h-[60vh] bg-gradient-to-b from-orange-200/30 via-orange-100/10 to-transparent -z-10"></div>
                <div className="fixed top-[-15%] right-[-10%] w-[60vh] h-[60vh] rounded-full bg-orange-300/20 blur-3xl -z-10 animate-pulse-slow"></div>

                    <div className="absolute inset-0 pointer-events-none z-0 overflow-hidden">
                        <div className="absolute -top-6 -right-6 text-orange-200/60">
                            <Sun className="w-28 h-28 opacity-80 animate-spin-slow" />
                        </div>
                        <div className="absolute top-2 -left-4 text-cyan-100/90">
                            <Cloud className="w-20 h-20 fill-current opacity-90 animate-float-x" />
                        </div>
                        <div className="absolute top-12 right-20 w-24 border-t-2 border-dashed border-stone-300/40 -rotate-12"></div>
                        <div className="absolute top-9 right-16 text-stone-300/60 -rotate-12">
                            <Plane className="w-4 h-4" />
                        </div>
                        <div className="absolute -bottom-1 left-0 w-full text-white/50 z-10">
                            <svg viewBox="0 0 1440 320" className="w-full h-8 sm:h-12 object-cover opacity-80" preserveAspectRatio="none">
                                <path fill="currentColor" fillOpacity="1" d="M0,224L48,213.3C96,203,192,181,288,192C384,203,480,245,576,245.3C672,245,768,203,864,186.7C960,171,1056,181,1152,192C1248,203,1344,213,1392,218.7L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
                            </svg>
                        </div>
                    </div>

                    <div className="relative z-10 max-w-md mx-auto px-6 pt-4 pb-2 flex justify-between items-start">
                        <div>
                            <div className="flex items-center gap-2 mb-1">
                                <h1 className="text-xl font-bold text-cyan-800 tracking-wide drop-shadow-sm">2026 沖繩舒活之旅</h1>
                                <Flower2 className="w-5 h-5 text-rose-300 animate-spin-slow" />
                            </div>
                            <div className="flex items-center mt-0.5 ml-1">
                                <Sunset className="w-3 h-3 text-orange-400 mr-1" />
                                <p className="text-xs text-cyan-700/80 font-medium">May 22 - May 27</p>
                            </div>
                        </div>
                    </div>

                    <div className="relative z-10 flex overflow-x-auto hide-scrollbar px-4 pb-4 gap-3 max-w-md mx-auto snap-x pt-2">
                        {itineraryData.map((item, index) => (
                            <button
                                key={index}
                                onClick={() => setActiveDay(index)}
                                className={`flex-shrink-0 snap-center flex flex-col items-center justify-center min-w-[60px] py-2 rounded-xl transition-all duration-300 border backdrop-blur-sm ${
                                    activeDay === index
                                        ? 'bg-gradient-to-br from-teal-500 to-cyan-600 text-white shadow-lg shadow-cyan-200/50 scale-105 border-transparent'
                                        : 'bg-white/40 text-stone-500 hover:bg-white/60 border-white/40'
                                }`}
                            >
                                <span className="text-xs font-medium">{item.date}</span>
                                <span className="text-sm font-bold mt-0.5">({item.day})</span>
                            </button>
                        ))}
                    </div>
                </header>

                {/* Main Content */}
                <main className={`max-w-md mx-auto px-5 pt-6 transition-opacity duration-500 ${animate ? 'opacity-0 translate-y-2' : 'opacity-100 translate-y-0'}`}>

                    <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-6 shadow-lg shadow-cyan-900/5 border border-white mb-8 relative overflow-hidden">
                        <div className={`absolute top-0 right-0 w-32 h-32 -mr-8 -mt-8 rounded-full opacity-15
                                ${currentItinerary.color.includes('orange') ? 'bg-orange-300' :
                            currentItinerary.color.includes('blue') || currentItinerary.color.includes('cyan') ? 'bg-cyan-400' : 'bg-teal-300'}`}></div>
                        <div className="relative z-10">
                            <div className="flex justify-between items-start">
                                <div>
                                        <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold mb-3 ${currentItinerary.color}`}>
                                        Day {activeDay + 1}
                                        </span>
                                    <h2 className="text-2xl font-bold text-stone-800 mb-2">{currentItinerary.title}</h2>
                                    <div className="flex items-center text-stone-500 text-sm font-medium">
                                        <MapPin className="w-4 h-4 mr-1.5 text-cyan-600" />
                                        {currentItinerary.location}
                                    </div>
                                </div>

                                <div className="flex flex-col items-center bg-white/50 backdrop-blur-md rounded-2xl p-2 border border-white shadow-sm min-w-[70px]">
                                    {weatherLoading ? (
                                        <div className="w-6 h-6 border-2 border-teal-200 border-t-teal-500 rounded-full animate-spin my-1"></div>
                                    ) : weatherData ? (
                                        <div className="flex flex-col items-center">
                                            <div className="mb-1">{getWeatherIcon(weatherData.weather_code)}</div>
                                            <span className="text-lg font-bold text-stone-700">{Math.round(weatherData.temperature_2m)}°</span>
                                            <span className="text-[10px] text-stone-400">
                                                    {isWeatherFallback ? "5月均溫" : "目前氣溫"}
                                                </span>
                                        </div>
                                    ) : (
                                        <span className="text-xs text-stone-400">N/A</span>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="relative pl-4 space-y-8 mb-12">
                        <div className="absolute left-[19px] top-2 bottom-4 w-[2px] bg-gradient-to-b from-cyan-200 to-stone-200"></div>

                        {currentItinerary.events.map((event, idx) => {
                            const hasNote = !!journalEntries[`${activeDay}-${idx}`];
                            return (
                                <div key={idx} className="relative flex group">
                                    <div className="flex-shrink-0 w-10 h-10 rounded-full bg-white border-2 border-cyan-50 shadow-md shadow-cyan-900/5 flex items-center justify-center z-10 text-stone-400 group-hover:border-cyan-400 group-hover:text-cyan-600 transition-all duration-300 group-hover:scale-110">
                                        {event.icon}
                                    </div>

                                    <div className="ml-5 flex-1 pt-1 pb-4 border-b border-stone-200/60 last:border-0 relative">
                                        <div className="flex items-start justify-between">
                                            <div className="flex-1">
                                                <div className="flex items-baseline mb-1">
                                                    <span className="font-mono text-cyan-700 font-bold text-sm mr-3">{event.time}</span>
                                                    <h3 className="font-bold text-stone-800 text-lg leading-tight">{event.title}</h3>
                                                </div>
                                                {event.desc && (
                                                    <p className="text-stone-500 text-sm leading-relaxed mt-1">{event.desc}</p>
                                                )}
                                                {hasNote && (
                                                    <div
                                                        onClick={() => handleOpenNote(activeDay, idx, event.title)}
                                                        className="mt-2 bg-yellow-50 border border-yellow-100 p-2 rounded-lg text-xs text-stone-600 flex items-start cursor-pointer hover:bg-yellow-100 transition-colors"
                                                    >
                                                        <StickyNote className="w-3 h-3 mr-1.5 mt-0.5 text-yellow-500 flex-shrink-0" />
                                                        <span className="line-clamp-2">{journalEntries[`${activeDay}-${idx}`]}</span>
                                                    </div>
                                                )}
                                            </div>

                                            <button
                                                onClick={() => handleOpenNote(activeDay, idx, event.title)}
                                                className={`ml-3 p-2 rounded-full shadow-sm border transition-all ${
                                                    hasNote
                                                        ? 'bg-teal-100 border-teal-200 text-teal-600 hover:bg-teal-200'
                                                        : 'bg-white border-stone-200 text-stone-400 hover:border-teal-300 hover:text-teal-500'
                                                }`}
                                                title="寫下心情"
                                            >
                                                <PenTool className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {currentItinerary.hotel && (
                        <div className="mt-8 mb-12">
                            <h3 className="text-xs font-bold text-stone-400 uppercase tracking-wider mb-3 ml-1">Tonight's Stay</h3>
                            <div className="bg-white/90 backdrop-blur-sm rounded-2xl p-5 shadow-lg shadow-cyan-900/5 border border-white flex items-start gap-4 transform transition hover:-translate-y-1 duration-300 hover:shadow-cyan-100">
                                <div className="bg-orange-50 p-3 rounded-xl text-orange-500 shadow-sm">
                                    <BedDouble className="w-6 h-6" />
                                </div>
                                <div>
                                    <h4 className="font-bold text-stone-800 mb-1 leading-snug">{currentItinerary.hotel}</h4>
                                    <p className="text-xs text-stone-500 flex items-center mt-1">
                                        <Star className="w-3 h-3 mr-1 text-yellow-400 fill-current" />
                                        好好休息，期待明天
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                </main>

                {/* Journal Modal */}
                {editingNote && (
                    <div className="fixed inset-0 z-[80] flex items-center justify-center p-4">
                        <div
                            className="absolute inset-0 bg-stone-900/40 backdrop-blur-sm"
                            onClick={() => setEditingNote(null)}
                        ></div>
                        <div className="bg-[#fffdf5] w-full max-w-sm rounded-2xl shadow-2xl relative z-10 p-6 border border-stone-100 transform transition-all scale-100 rotate-1">
                            <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-24 h-6 bg-teal-200/50 backdrop-blur-sm rotate-2 shadow-sm"></div>

                            <div className="flex justify-between items-center mb-4 mt-2">
                                <h3 className="font-bold text-stone-700 flex items-center gap-2">
                                    <StickyNote className="w-5 h-5 text-yellow-500" />
                                    隨手筆記
                                </h3>
                                <button onClick={() => setEditingNote(null)} className="text-stone-400 hover:text-stone-600">
                                    <X className="w-5 h-5" />
                                </button>
                            </div>

                            <div className="mb-4">
                                <p className="text-xs text-stone-400 mb-1">關於：</p>
                                <p className="text-sm font-medium text-teal-700 bg-teal-50 px-2 py-1 rounded-md inline-block">
                                    {editingNote.title}
                                </p>
                            </div>

                            <textarea
                                className="w-full h-40 bg-transparent border-none resize-none focus:ring-0 text-stone-600 leading-relaxed placeholder:text-stone-300"
                                style={{ backgroundImage: 'linear-gradient(transparent 95%, #e5e7eb 95%)', backgroundSize: '100% 1.5rem', lineHeight: '1.5rem' }}
                                placeholder="在這裡寫下你的心情、發現、或是花費記錄..."
                                value={editingNote.text}
                                onChange={(e) => setEditingNote({ ...editingNote, text: e.target.value })}
                            ></textarea>

                            <div className="flex justify-end mt-4">
                                <button
                                    onClick={handleSaveNote}
                                    className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 shadow-lg shadow-teal-200 transition-all"
                                >
                                    <Save className="w-4 h-4" />
                                    保存筆記
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {/* AI Assistant Modal */}
                {isAIOpen && (
                    <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center pointer-events-none">
                        <div
                            className="absolute inset-0 bg-stone-900/30 backdrop-blur-sm pointer-events-auto transition-opacity"
                            onClick={() => setIsAIOpen(false)}
                        ></div>
                        <div className="bg-white w-full max-w-md h-[80vh] sm:h-[70vh] sm:rounded-3xl rounded-t-3xl shadow-2xl flex flex-col pointer-events-auto transform transition-transform duration-300 animate-slide-up">
                            <div className="p-5 border-b border-stone-100 flex justify-between items-center bg-gradient-to-r from-teal-50 to-cyan-50 sm:rounded-t-3xl rounded-t-3xl">
                                <div className="flex items-center gap-2">
                                    <div className="bg-teal-500 p-1.5 rounded-lg">
                                        <Sparkles className="w-5 h-5 text-white" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-teal-800">AI 沖繩小幫手</h3>
                                        <p className="text-xs text-teal-600">針對 {currentItinerary.date} 的行程提供建議</p>
                                    </div>
                                </div>
                                <button onClick={() => setIsAIOpen(false)} className="p-2 hover:bg-black/5 rounded-full text-stone-500 transition-colors">
                                    <X className="w-5 h-5" />
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-6 bg-stone-50">
                                {aiLoading ? (
                                    <div className="flex flex-col items-center justify-center h-full space-y-4 text-stone-400">
                                        <div className="w-10 h-10 border-4 border-teal-200 border-t-teal-500 rounded-full animate-spin"></div>
                                        <p className="text-sm animate-pulse">正在詢問 Gemini...</p>
                                    </div>
                                ) : aiResponse ? (
                                    <div ref={responseRef} className="prose prose-stone prose-sm max-w-none">
                                        <div className="bg-white p-5 rounded-xl shadow-sm border border-stone-100 whitespace-pre-wrap leading-relaxed markdown-text text-stone-600">
                                            {aiResponse}
                                        </div>
                                        <div className="mt-4 text-center">
                                            <p className="text-xs text-stone-400">AI 建議僅供參考，實際情況請以當地為主</p>
                                            <button onClick={() => setAiResponse(null)} className="mt-3 text-sm text-teal-600 font-medium hover:underline">
                                                問別的問題
                                            </button>
                                        </div>
                                    </div>
                                ) : aiError ? (
                                    <div className="flex flex-col items-center justify-center h-full text-center p-4">
                                        <p className="text-red-500 mb-2">{aiError}</p>
                                        <button onClick={() => setAiError(null)} className="text-sm text-stone-500 underline">重試</button>
                                    </div>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center text-center space-y-6 opacity-80">
                                        <p className="text-stone-500 mb-2">想知道什麼呢？</p>
                                        <div className="grid grid-cols-1 w-full gap-3">
                                            <button onClick={() => askGemini('guide')} className="flex items-center gap-4 p-4 bg-white rounded-xl shadow-sm border border-stone-100 hover:border-teal-300 hover:shadow-md transition-all group text-left">
                                                <div className="bg-orange-100 p-3 rounded-full text-orange-600 group-hover:bg-orange-500 group-hover:text-white transition-colors"><Info className="w-5 h-5" /></div>
                                                <div><h4 className="font-bold text-stone-800">景點解說 & 冷知識</h4><p className="text-xs text-stone-400 mt-1">告訴我關於今天景點的有趣故事</p></div>
                                            </button>
                                            <button onClick={() => askGemini('food')} className="flex items-center gap-4 p-4 bg-white rounded-xl shadow-sm border border-stone-100 hover:border-teal-300 hover:shadow-md transition-all group text-left">
                                                <div className="bg-rose-100 p-3 rounded-full text-rose-600 group-hover:bg-rose-500 group-hover:text-white transition-colors"><Utensils className="w-5 h-5" /></div>
                                                <div><h4 className="font-bold text-stone-800">附近美食推薦</h4><p className="text-xs text-stone-400 mt-1">這附近有什麼好吃的？</p></div>
                                            </button>
                                            <button onClick={() => askGemini('translation')} className="flex items-center gap-4 p-4 bg-white rounded-xl shadow-sm border border-stone-100 hover:border-teal-300 hover:shadow-md transition-all group text-left">
                                                <div className="bg-blue-100 p-3 rounded-full text-blue-600 group-hover:bg-blue-500 group-hover:text-white transition-colors"><Languages className="w-5 h-5" /></div>
                                                <div><h4 className="font-bold text-stone-800">實用日語短句</h4><p className="text-xs text-stone-400 mt-1">今天可能會用到的日文</p></div>
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                )}

                {/* Image Modal */}
                {isImageModalOpen && (
                    <div className="fixed inset-0 z-[70] flex items-center justify-center bg-stone-900/90 backdrop-blur-md p-4 animate-fade-in">
                        <button onClick={() => setIsImageModalOpen(false)} className="absolute top-6 right-6 p-2 bg-white/10 text-white rounded-full hover:bg-white/20 transition-colors">
                            <X className="w-8 h-8" />
                        </button>
                        <div className="relative max-w-4xl max-h-[90vh] w-full overflow-hidden rounded-lg shadow-2xl bg-white">
                            <div className="w-full h-[80vh] flex flex-col items-center justify-center bg-stone-100 text-stone-400">
                                <ImageIcon className="w-16 h-16 mb-4 opacity-50" />
                                <p className="text-lg font-medium">在此處放入您的行程總表圖片</p>
                                <p className="text-sm mt-2 opacity-70">請在 HTML 原始碼中搜尋 <code>img src</code> 並替換連結</p>
                                {/* <img src="YOUR_IMAGE_URL_HERE" alt="完整行程表" className="w-full h-full object-contain" /> */}
                            </div>
                        </div>
                    </div>
                )}

                {/* Floating Action Buttons */}
                <div className="fixed bottom-6 right-6 z-40 flex flex-col gap-3">
                    <button onClick={() => setIsImageModalOpen(true)} className="bg-white text-stone-600 p-4 rounded-full shadow-lg shadow-stone-900/10 border border-stone-50 transition-all active:scale-95 flex items-center justify-center relative group hover:bg-stone-50" title="查看完整行程表">
                        <ImageIcon className="w-6 h-6" />
                        <span className="absolute right-full mr-3 bg-stone-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">行程總覽</span>
                    </button>
                    <button onClick={() => setIsAIOpen(true)} className="bg-white text-teal-600 p-4 rounded-full shadow-lg shadow-teal-900/10 border border-teal-50 transition-all active:scale-95 flex items-center justify-center relative group hover:bg-teal-50">
                        <Sparkles className="w-6 h-6 animate-pulse" />
                        <span className="absolute right-full mr-3 bg-stone-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">AI 小幫手</span>
                    </button>
                    <button onClick={handleNavigation} className="bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-600 hover:to-cyan-700 text-white p-4 rounded-full shadow-lg shadow-cyan-600/30 transition-all active:scale-95 flex items-center justify-center">
                        <MapPin className="w-6 h-6" />
                    </button>
                </div>

            </div>
        );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<ItineraryApp />);
</script>
</body>
</html>
